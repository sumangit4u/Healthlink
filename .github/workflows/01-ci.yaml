# ============================================================================
# WORKFLOW 1 - Continuous Integration (lint + tests) for the whole repo.
# Runs on every push / PR. Fast, no cloud credentials needed.
# ============================================================================
name: CI - Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: pip install ruff pytest

      - name: Ruff (lint)
        run: ruff check shared services || true  # advisory; do not block the build

      - name: Compile-check all services
        run: python -m compileall -q shared services

      - name: Pytest (if tests present)
        run: |
          if [ -d tests ]; then pytest -q || true; else echo "no tests dir - skipping"; fi
